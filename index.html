<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APG Creative Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF7F0;
    --paper-deep:#F2ECE0;
    --ink:#1B1811;
    --ink-soft:#4A443A;
    --brass:#A8813F;
    --brass-deep:#8A6A30;
    --stone:#8A8377;
    --line:#DED5C2;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    background:var(--paper-deep);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .doc{
    width:100%;
    max-width:520px;
    background:var(--paper);
    border:1px solid var(--line);
    position:relative;
  }
  .doc::before{
    content:"";
    position:absolute;
    inset:10px;
    border:1px solid var(--line);
    pointer-events:none;
  }
  .inner{
    padding:72px 40px 56px;
    text-align:center;
  }

  .monogram{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:clamp(48px, 11vw, 68px);
    letter-spacing:0.12em;
    color:var(--ink);
    line-height:1;
  }
  .studio-label{
    margin-top:10px;
    font-size:12px;
    letter-spacing:0.3em;
    text-transform:uppercase;
    color:var(--stone);
  }

  .monogram-rule{
    width:34px;
    height:1px;
    background:var(--brass);
    margin:34px auto;
  }

  .description{
    max-width:380px;
    margin:0 auto;
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:19px;
    line-height:1.65;
    color:var(--ink-soft);
  }

  .services{
    margin-top:32px;
    font-size:10.5px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--brass-deep);
    font-weight:600;
  }

  .notice{
    margin-top:56px;
    padding-top:22px;
    border-top:1px solid var(--line);
    font-size:12px;
    color:var(--stone);
    line-height:1.6;
  }

  @media (max-width:380px){
    .inner{ padding:56px 26px 40px; }
    .description{ font-size:17px; }
  }
</style>
</head>
<body>

<div class="doc">
  <div class="inner">
    <div class="monogram">APG</div>
    <div class="studio-label">Creative Studio</div>

    <div class="monogram-rule"></div>

    <p class="description">
      Fotografía, cine y producción creativa para contar historias
      con intención, sensibilidad y estilo.
    </p>

    <div class="services">Photography · Films · Creative Production</div>

    <p class="notice">
      Las propuestas personalizadas se consultan mediante<br>
      el enlace privado proporcionado a cada cliente.
    </p>
  </div>
</div>

</body>
</html>
